<section class="destacados-strip" rzReveal>
  <div class="container">
    <div class="destacados-grid">
      <div class="destacado-item" *ngFor="let item of items">
        <rz-icon [name]="item.icono" [size]="24" [strokeWidth]="1.5" />
        <span class="destacado-valor">{{ item.valor }}</span>
        <span class="destacado-label">{{ item.label }}</span>
      </div>
    </div>
  </div>
</section>
