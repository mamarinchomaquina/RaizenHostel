<section class="page-hero">
  <div class="container">
    <span class="t-label">Imágenes del hostal</span>
    <h1>Galería</h1>
    <p>Un vistazo a los espacios, habitaciones y el entorno de Raizen Hostel en Dosquebradas.</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <!-- Loading skeleton -->
    <div *ngIf="loading()" class="galeria-grid">
      <div class="skeleton galeria-skeleton" *ngFor="let i of [1,2,3,4,5,6]"></div>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading() && imagenes().length === 0" class="empty-state">
      <rz-icon name="image" [size]="56" />
      <p>Las fotos del hostal estarán disponibles pronto.</p>
    </div>

    <!-- Mosaico -->
    <div *ngIf="imagenes().length" class="galeria-grid">
      <div
        class="galeria-item"
        *ngFor="let img of imagenes(); let i = index"
        [class.span-wide]="img.span_wide"
        [class.span-tall]="img.span_tall"
        rzReveal [rzDelay]="(i % 6) * 60"
        (click)="openLightbox(img)">
        <img [src]="img.url" [alt]="img.alt_text" loading="lazy" />
        <div class="galeria-item__overlay">
          <rz-icon name="zoom-in" [size]="28" />
        </div>
      </div>
    </div>

  </div>
</section>

<!-- Lightbox -->
<div class="lightbox" *ngIf="lightbox()" (click)="closeLightbox()">
  <button class="lightbox__close" (click)="closeLightbox()" aria-label="Cerrar">
    <rz-icon name="x" [size]="28" />
  </button>
  <button class="lightbox__arrow lightbox__arrow--prev" (click)="$event.stopPropagation(); prevImage()" aria-label="Anterior">
    <rz-icon name="chevron-left" [size]="32" />
  </button>
  <div class="lightbox__content" (click)="$event.stopPropagation()">
    <img [src]="lightbox()!.url" [alt]="lightbox()!.alt_text" />
    <p *ngIf="lightbox()!.alt_text" class="lightbox__caption">{{ lightbox()!.alt_text }}</p>
  </div>
  <button class="lightbox__arrow lightbox__arrow--next" (click)="$event.stopPropagation(); nextImage()" aria-label="Siguiente">
    <rz-icon name="chevron-right" [size]="32" />
  </button>
</div>
