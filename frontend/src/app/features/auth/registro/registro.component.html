<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <span class="auth-card__logo">Raizen</span>
      <h1 class="auth-card__title">Crea tu cuenta</h1>
      <p class="auth-card__sub">Regístrate para reservar y gestionar tus estadías</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <div class="input-icon-wrap">
          <rz-icon name="user" [size]="16" class="input-icon" />
          <input id="nombre" type="text" formControlName="nombre" placeholder="Tu nombre completo" autocomplete="name" />
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-icon-wrap">
          <rz-icon name="mail" [size]="16" class="input-icon" />
          <input id="email" type="email" formControlName="email" placeholder="tu@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono <span style="font-weight:300;font-style:italic">(opcional)</span></label>
        <div class="input-icon-wrap">
          <rz-icon name="phone" [size]="16" class="input-icon" />
          <input id="telefono" type="tel" formControlName="telefono" placeholder="+57 300 000 0000" />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-icon-wrap">
          <rz-icon name="lock" [size]="16" class="input-icon" />
          <input id="password" [type]="showPwd() ? 'text' : 'password'" formControlName="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <button type="button" class="input-toggle" (click)="showPwd.update(v => !v)">
            <rz-icon [name]="showPwd() ? 'eye-off' : 'eye'" [size]="16" />
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="password2">Confirmar contraseña</label>
        <div class="input-icon-wrap">
          <rz-icon name="lock" [size]="16" class="input-icon" />
          <input id="password2" [type]="showPwd() ? 'text' : 'password'" formControlName="password2" placeholder="Repite tu contraseña" autocomplete="new-password" />
        </div>
        <span class="form-error" *ngIf="form.errors?.['mismatch'] && form.get('password2')?.dirty">
          Las contraseñas no coinciden
        </span>
      </div>

      <!-- Captcha Section -->
      <div class="form-group">
        <label for="captcha">Verificación de seguridad</label>
        <div class="captcha-container">
          <div class="captcha-challenge-box" [class.captcha-loading]="captchaLoading()">
            <span class="captcha-math">{{ captchaChallenge() }}</span>
            <button type="button" class="btn-refresh" (click)="cargarCaptcha()" title="Recargar Captcha">
              <rz-icon name="loader" [size]="14" class="spin" *ngIf="captchaLoading()" />
              <rz-icon name="info" [size]="14" *ngIf="!captchaLoading()" />
            </button>
          </div>
          <div class="input-icon-wrap captcha-input-wrap">
            <rz-icon name="shield" [size]="14" class="input-icon" />
            <input id="captcha" type="text" formControlName="captcha_answer" placeholder="Resultado" autocomplete="off" />
          </div>
        </div>
      </div>


      <rz-alerta [mensaje]="error()" tipo="error" />

      <button type="submit" class="btn btn--primary btn--full" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="auth-card__footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
