<article class="hab-card">
  <!-- Carrusel / Imagen -->
  <div class="hab-card__img-wrap" (click)="openLightbox()">
    <img
      *ngIf="imagenPrincipal; else iconFallback"
      [src]="imagenPrincipal"
      [alt]="hab.nombre_display"
      loading="lazy"
      class="hab-card__img">
      
    <!-- Fallback si no hay foto -->
    <ng-template #iconFallback>
      <div class="hab-card__img-placeholder">
        <rz-icon name="bed" [size]="48" [strokeWidth]="1" />
      </div>
    </ng-template>

    <!-- Controles de carrusel (sólo si hay múltiples imágenes) -->
    <ng-container *ngIf="imagenes().length > 1">
      <button class="hab-card__btn-nav hab-card__btn-nav--prev" (click)="prevImage($event)" aria-label="Anterior foto">
        <rz-icon name="chevron-left" [size]="18" />
      </button>
      <button class="hab-card__btn-nav hab-card__btn-nav--next" (click)="nextImage($event)" aria-label="Siguiente foto">
        <rz-icon name="chevron-right" [size]="18" />
      </button>
      
      <!-- Indicadores de puntos -->
      <div class="hab-card__dots">
        <span *ngFor="let img of imagenes(); let i = index" 
              class="hab-card__dot" 
              [class.hab-card__dot--active]="currentImageIndex() === i">
        </span>
      </div>
    </ng-container>

    <rz-badge [variant]="hab.disponible ? 'exito' : 'error'" class="hab-card__badge">
      {{ hab.disponible ? 'Disponible' : 'Ocupada' }}
    </rz-badge>
  </div>

  <!-- Contenido de tarjeta -->
  <div class="hab-card__body">
    <div class="hab-card__meta">
      <span class="hab-card__numero">{{ hab.numero }}</span>
      <span class="hab-card__capacidad">
        <rz-icon name="users" [size]="14" />
        {{ hab.tipo?.capacidad ?? 1 }} persona{{ (hab.tipo?.capacidad ?? 1) > 1 ? 's' : '' }}
      </span>
    </div>

    <h3 class="hab-card__title">{{ hab.nombre_display }}</h3>
    <p class="hab-card__desc">{{ hab.descripcion }}</p>

    <div class="hab-card__footer">
      <span class="hab-card__precio">{{ hab.precio | copCurrency }}</span>
      <a
        class="btn btn--primary btn--sm"
        [routerLink]="['/reservas']"
        [queryParams]="{unidad: hab.id}"
        [class.disabled]="!hab.disponible"
        [attr.aria-disabled]="!hab.disponible">
        Reservar
      </a>
    </div>
  </div>
</article>

<!-- Lightbox de fotos -->
<div class="lightbox" *ngIf="lightboxOpen()" (click)="closeLightbox()">
  <button class="lightbox__close" (click)="closeLightbox()" aria-label="Cerrar visor">
    <rz-icon name="x" [size]="24" />
  </button>

  <button *ngIf="imagenes().length > 1" class="lightbox__nav lightbox__nav--prev" (click)="prevImage($event)">
    <rz-icon name="chevron-left" [size]="32" />
  </button>
  
  <img [src]="imagenPrincipal" alt="Foto de la habitación ampliada" (click)="$event.stopPropagation()" />

  <button *ngIf="imagenes().length > 1" class="lightbox__nav lightbox__nav--next" (click)="nextImage($event)">
    <rz-icon name="chevron-right" [size]="32" />
  </button>
  
  <div class="lightbox__counter" *ngIf="imagenes().length > 1">
    {{ currentImageIndex() + 1 }} / {{ imagenes().length }}
  </div>
</div>
